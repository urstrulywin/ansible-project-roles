- name: copy mongo repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb server
  package:
    name: mongodb-org
    state: present

- name: replace 127.0.0.1 to 0.0.0.0
  replace:
    path: /etc/mongod.conf
    regexp: 127.0.0.1
    replace: 0.0.0.0

- name: start and enable mongodb
  service:
    name: mongod
    state: started # restarted is not idempotent
    enabled: yes
