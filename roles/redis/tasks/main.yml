- name: install redis
  package:
    name: redis
    state: present

- name: allow remote connections
  replace:
    path: /etc/redis/redis.conf
    regexp: "127.0.0.1"
    replace: "0.0.0.0"

- name: change protected mode
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: "protected-mode"
    line: protected-mode no

- name: start n enable redis service
  service:
    name: redis
    state: started
    enabled: yes
